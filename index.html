<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สั่งอาหาร - ร้านข้าวมัน กำนันต้อย</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#121212] text-white font-sans min-h-screen pb-32">

    <!-- แถบบอนหัวเว็บ -->
    <div class="bg-neutral-900 border-b border-neutral-800 p-4 sticky top-0 z-50 flex justify-between items-center">
        <div>
            <h1 class="font-black text-lg text-red-500 uppercase tracking-wider">ข้าวมัน กำนันต้อย</h1>
            <p id="table-badge" class="text-xs text-neutral-400 font-mono">โต๊ะ: --</p>
        </div>
        <div class="space-x-2">
            <button onclick="window.open('bill.html?table=' + currentTable, '_blank', 'width=400,height=650')" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold px-3 py-2 rounded">
                🧾 เช็กบิล
            </button>
            <a href="kitchen.html" class="px-3 py-1.5 bg-neutral-800 hover:bg-neutral-700 text-xs font-bold rounded">ครัว (KDS)</a>
        </div>
    </div>

    <!-- พื้นที่แสดงเมนูทั้งหมดแบ่งตามหมวดหมู่ -->
    <main class="max-w-4xl mx-auto p-4 space-y-8">
        
        <!-- หมวดที่ 1: ข้าวมันไก่ -->
        <section>
            <h2 class="text-xl font-bold mb-4 border-l-4 border-red-600 pl-3 uppercase">🍗 ข้าวมันไก่ & ข้าวอื่นๆ</h2>
            <div id="section-chicken" class="grid grid-cols-2 gap-4"></div>
        </section>

        <!-- หมวดที่ 2: ซุป -->
        <section>
            <h2 class="text-xl font-bold mb-4 border-l-4 border-yellow-500 pl-3 uppercase">🍲 ซุป & ต้ม</h2>
            <div id="section-soup" class="grid grid-cols-2 gap-4"></div>
        </section>

        <!-- หมวดที่ 3: น้ำดื่ม -->
        <section>
            <h2 class="text-xl font-bold mb-4 border-l-4 border-blue-500 pl-3 uppercase">🥤 น้ำดื่ม</h2>
            <div id="section-water" class="grid grid-cols-2 gap-4"></div>
        </section>

    </main>

    <!-- แถบตะกร้าสินค้าด้านล่าง -->
    <div class="fixed bottom-0 left-0 right-0 bg-neutral-900 border-t border-neutral-800 p-4 flex justify-between items-center max-w-4xl mx-auto rounded-t-2xl shadow-2xl">
        <div>
            <span class="text-xs text-neutral-400 block">ยอดรวมตะกร้า</span>
            <span id="cart-total" class="text-lg font-mono font-black text-red-500">0 ฿</span>
        </div>
        <div class="space-x-2">
            <button onclick="callStaff()" class="bg-yellow-600 hover:bg-yellow-700 text-white text-xs font-bold px-3 py-2 rounded">🔔 เรียกพนักงาน</button>
            <button onclick="submitOrder()" class="bg-red-600 hover:bg-red-700 text-white text-xs font-bold px-5 py-2.5 rounded-lg shadow-lg shadow-red-900/50 uppercase tracking-wider">✅ ยืนยันออร์เดอร์</button>
        </div>
    </div>

    <!-- สคริปต์ควบคุมระบบทั้งหมดในหน้าเดียว -->
    <script>
         // 1. จัดการเลขโต๊ะ (ยึดค่าจาก URL ?table= เป็นหลักเสมอ)
        let currentTable = "1";
        const urlParams = new URLSearchParams(window.location.search);

        if (urlParams.get('table')) {
         // ถ้าในลิงก์มีพารามิเตอร์ ?table= มา ให้เซฟและใช้งานค่านั้นทันที
         currentTable = urlParams.get('table');
         localStorage.setItem('kanantoy_table', currentTable);
            } else {
      // ถ้าไม่มีใน URL ค่อยดึงค่าล่าสุดที่เคยจำไว้ หรือถ้าไม่มีเลยให้เป็น "1"
          currentTable = localStorage.getItem('kanantoy_table') || "1";
    }

        document.getElementById('table-badge').innerText = `โต๊ะ: ${currentTable}`;

        // 2. ฐานข้อมูลเมนูทั้งหมดรวมกันที่เดียว
        const allMenus = [
            { id: 101, category: 'chicken', name: "ไก่บ้านสับ", price: 150, image: "images/kaibansup-001.jpg" },
            { id: 102, category: 'chicken', name: "ข้าวมันไก่ทอด", price: 60, image: "images/S__45498379.jpg" },
            { id: 103, category: 'chicken', name: "ข้าวมันแกงเนื้อ", price: 150, image: "images/S__45498375.jpg" },
            { id: 104, category: 'chicken', name: "ข้าวมันไก่ต้ม", price: 60, image: "images/S__45498376.jpg" },
            
            { id: 201, category: 'soup', name: "ซุปเปอร์เล้งแซ่บ", price: 120, image: "images/C2233608-A7CC-4066-B4F8-78C469F793D6.jpg" },
            { id: 202, category: 'soup', name: "ซุปหางวัว", price: 60, image: "images/DCD4FB4C-4ED2-4195-989E-482D3E4B048E.jpg" },

            { id: 301, category: 'water', name: "น้ำเก๊กฮวย", price: 35, image: "images/S__45547522.jpg" },
            { id: 302, category: 'water', name: "ชาดำเย็น", price: 35, image: "images/S__45547524.jpg" }
        ];

        let cart = JSON.parse(localStorage.getItem('cart')) || {};

        // 3. เรนเดอร์เมนูแยกตามหมวดหมู่
        function renderAllMenus() {
            const chickenGrid = document.getElementById('section-chicken');
            const soupGrid = document.getElementById('section-soup');
            const waterGrid = document.getElementById('section-water');

            chickenGrid.innerHTML = "";
            soupGrid.innerHTML = "";
            waterGrid.innerHTML = "";

            allMenus.forEach(item => {
                let qty = cart[item.id] || 0;
                const card = document.createElement("div");
                card.className = "bg-neutral-900 border border-neutral-800 rounded-xl overflow-hidden flex flex-col justify-between shadow-lg";
                card.innerHTML = `
                    <div class="relative h-44 bg-neutral-950">
                        <img src="${item.image}" alt="${item.name}" class="w-full h-full object-cover opacity-80" onerror="this.src='https://via.placeholder.com/150?text=No+Image'">
                        <span class="absolute top-2 right-2 bg-red-600 text-white text-[10px] font-black px-2 py-0.5 rounded">${item.price} ฿</span>
                    </div>
                    <div class="p-3">
                        <h3 class="font-bold text-sm text-white truncate">${item.name}</h3>
                    </div>
                    <div class="p-3 pt-0 flex items-center justify-between">
                        <span class="text-[10px] text-neutral-400">จำนวน</span>
                        <div class="flex items-center space-x-2 bg-neutral-950 border border-neutral-800 px-2 py-1 rounded">
                            <button onclick="updateQty(${item.id}, -1)" class="text-neutral-400 hover:text-white font-mono font-bold px-1.5">-</button>
                            <span id="qty-${item.id}" class="font-mono text-white text-xs font-bold w-4 text-center">${qty}</span>
                            <button onclick="updateQty(${item.id}, 1)" class="text-neutral-400 hover:text-white font-mono font-bold px-1.5">+</button>
                        </div>
                    </div>
                `;

                if (item.category === 'chicken') chickenGrid.appendChild(card);
                else if (item.category === 'soup') soupGrid.appendChild(card);
                else if (item.category === 'water') waterGrid.appendChild(card);
            });
            updateCartUI();
        }

        // 4. เพิ่มลดจำนวนสินค้าในตะกร้า
        function updateQty(itemId, change) {
            if (!cart[itemId]) cart[itemId] = 0;
            cart[itemId] += change;
            if (cart[itemId] < 0) cart[itemId] = 0;
            
            localStorage.setItem('cart', JSON.stringify(cart));
            
            const qtySpan = document.getElementById(`qty-${itemId}`);
            if (qtySpan) qtySpan.innerText = cart[itemId];
            updateCartUI();
        }

        // 5. คำนวณยอดรวมหน้าตะกร้า
        function updateCartUI() {
            let totalPrice = 0;
            allMenus.forEach(item => {
                const qty = cart[item.id] || 0;
                if (qty > 0) totalPrice += item.price * qty;
            });
            document.getElementById('cart-total').innerText = `${totalPrice} ฿`;
        }

        // 6. ยืนยันออร์เดอร์ (ส่งเข้ากองกลาง kanantoy_orders)
        function submitOrder() {
            let orderedItems = [];
            let hasItem = false;

            allMenus.forEach(item => {
                const qty = cart[item.id] || 0;
                if (qty > 0) {
                    hasItem = true;
                    orderedItems.push({
                        name: item.name,
                        quantity: qty,
                        price: item.price
                    });
                }
            });

            if (!hasItem) {
                alert('⚠️ กรุณาเลือกรายการอาหารก่อนยืนยันออร์เดอร์ครับเพื่อนรัก!');
                return;
            }

            const newOrder = {
                orderId: "ORD-" + Math.floor(1000 + Math.random() * 9000),
                table: currentTable,
                items: orderedItems,
                status: "pending",
                timestamp: new Date().toLocaleTimeString('th-TH')
            };

            let existingOrders = JSON.parse(localStorage.getItem("kanantoy_orders")) || [];
            existingOrders.push(newOrder);
            localStorage.setItem("kanantoy_orders", JSON.stringify(existingOrders));

            alert(`✅ ส่งออร์เดอร์โต๊ะ ${currentTable} ไปที่ห้องครัวเรียบร้อยแล้วครับ!`);
            
            // เคลียร์ตะกร้า
            cart = {};
            localStorage.removeItem('cart');
            renderAllMenus();
        }

        // 7. เรียกพนักงาน
        function callStaff() {
            const serviceOrder = {
                orderId: "SERV-" + Math.floor(1000 + Math.random() * 9000),
                table: currentTable,
                items: [{ name: "🔔 เรียกพนักงานบริการ", quantity: 1, price: 0 }],
                status: "service",
                timestamp: new Date().toLocaleTimeString('th-TH')
            };
            let existingOrders = JSON.parse(localStorage.getItem("kanantoy_orders")) || [];
            existingOrders.push(serviceOrder);
            localStorage.setItem("kanantoy_orders", JSON.stringify(existingOrders));
            alert(`🔔 ส่งสัญญาณเรียกพนักงานสำหรับโต๊ะ ${currentTable} แล้วครับ!`);
        }

        // โหลดหน้าเว็บ
        document.addEventListener('DOMContentLoaded', renderAllMenus);
    </script>
</body>
</html>
