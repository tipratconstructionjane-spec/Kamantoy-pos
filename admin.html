<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจัดการเมนูแอดมิน - ข้าวมัน กำนันต้อย</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-black text-gray-100 font-sans min-h-screen p-6">

    <!-- แถบปุ่มสลับหน้าเว็บลอยได้ -->
    <div class="fixed top-4 right-4 z-50 bg-neutral-900/95 border border-neutral-700 p-1.5 shadow-2xl backdrop-blur flex items-center space-x-1.5 rounded-md">
        <a href="index.html?table=1" class="px-3 py-1.5 bg-neutral-800 hover:bg-red-600 text-xs font-bold uppercase tracking-wider text-white transition rounded">
            🛍️ ลูกค้า
        </a>
        <a href="kitchen.html" class="px-3 py-1.5 bg-neutral-800 hover:bg-red-600 text-xs font-bold uppercase tracking-wider text-white transition rounded">
            🍳 ห้องครัว
        </a>
        <a href="admin.html" class="px-3 py-1.5 bg-neutral-800 hover:bg-red-600 text-xs font-bold uppercase tracking-wider text-white transition rounded">
            ⚙️ แอดมินเมนู
        </a>
    </div>

    <!-- Header -->
    <header class="border-b border-neutral-800 pb-4 mb-6">
        <h1 class="text-xl font-black uppercase text-red-600">⚙️ ระบบจัดการเมนูอาหาร (Admin CMS)</h1>
        <p class="text-xs text-neutral-400 uppercase tracking-wider">ร้านข้าวมัน กำนันต้อย สุวรรณภูมิ - เพิ่ม/ลบ เมนูและรูปภาพ</p>
    </header>

    <main class="max-w-4xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-6">
        <!-- ฟอร์มเพิ่มเมนูใหม่ -->
        <div class="bg-neutral-900 border border-neutral-800 p-6 shadow-xl h-fit">
            <h2 class="text-sm font-black uppercase text-white mb-4 pb-2 border-b border-neutral-800">➕ เพิ่มเมนูอาหารใหม่</h2>
            
            <!-- จัดโครงสร้างฟอร์มให้ครอบคลุม input ทุกตัวถูกต้อง -->
            <form id="add-menu-form" onsubmit="handleAddNewMenu(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold uppercase text-neutral-400 mb-1">ชื่อเมนูอาหาร</label>
                    <input type="text" id="menu-name" required class="w-full bg-neutral-950 border border-neutral-700 p-2.5 text-sm text-white rounded focus:border-red-600 outline-none" placeholder="เช่น ข้าวมันไก่พิเศษ">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase text-neutral-400 mb-1">ราคา (บาท)</label>
                    <input type="number" id="menu-price" required class="w-full bg-neutral-950 border border-neutral-700 p-2.5 text-sm text-white rounded focus:border-red-600 outline-none" placeholder="เช่น 60">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase text-neutral-400 mb-1">หมวดหมู่</label>
                    <select id="menu-category" class="w-full bg-neutral-950 border border-neutral-700 p-2.5 text-sm text-white rounded focus:border-red-600 outline-none">
                        <option value="rice">เมนูข้าวมันไก่</option>
                        <option value="soup">ซุปและต้ม</option>
                        <option value="drink">เครื่องดื่ม</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase text-neutral-400 mb-1">อัปโหลดรูปภาพ</label>
                    <input type="file" id="menu-image" accept="image/*" required class="w-full text-xs text-neutral-400 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-xs file:font-bold file:bg-neutral-800 file:text-white hover:file:bg-red-600 cursor-pointer">
                </div>
                <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white text-xs font-black uppercase py-3 tracking-wider transition rounded shadow-lg shadow-red-900/40">
                    บันทึกเพิ่มเมนู
                </button>
            </form>
        </div>

        <!-- รายการเมนูที่มีอยู่ -->
        <div class="md:col-span-2 bg-neutral-900 border border-neutral-800 p-6 shadow-xl">
            <h2 class="text-sm font-black uppercase text-white mb-4 pb-2 border-b border-neutral-800">📋 รายการเมนูทั้งหมดในระบบ</h2>
            <div id="admin-menu-list" class="space-y-3 max-h-[60vh] overflow-y-auto pr-2">
                <!-- รายการจะถูกเรนเดอร์ตรงนี้ -->
            </div>
        </div>
    </main>

    <script>
        // โหลดข้อมูลเมนูมาแสดง
        document.addEventListener("DOMContentLoaded", () => {
            loadAdminMenus();
        });

        // ดึงเมนูจาก localStorage หรือใช้ค่าเริ่มต้น
        function getStoredMenus() {
            let menus = JSON.parse(localStorage.getItem("kanantoy_menu_items"));
            if (!menus || menus.length === 0) {
                menus = [
                    { id: 1, name: "ข้าวมันไก่ตอนพิเศษ", price: 60, category: "rice", image: "https://images.unsplash.com/photo-1563379091339-03b21ab4a4f8?w=500&auto=format&fit=crop&q=60" },
                    { id: 2, name: "ข้าวมันไก่ทอดกรอบ", price: 60, category: "rice", image: "https://images.unsplash.com/photo-1626082927389-6cd097cdc6ec?w=500&auto=format&fit=crop&q=60" },
                    { id: 3, name: "ข้าวมันไก่ผสม (ตอน+ทอด)", price: 70, category: "rice", image: "https://images.unsplash.com/photo-1555939594-58d7cb561ad1?w=500&auto=format&fit=crop&q=60" },
                    { id: 4, name: "ซุปกระดูกหมูตุ๋น", price: 50, category: "soup", image: "https://images.unsplash.com/photo-1547592180-85f173990554?w=500&auto=format&fit=crop&q=60" },
                    { id: 5, name: "น้ำเก๊กฮวยเย็นๆ", price: 20, category: "drink", image: "https://images.unsplash.com/photo-1556679343-c7306c1976bc?w=500&auto=format&fit=crop&q=60" }
                ];
                localStorage.setItem("kanantoy_menu_items", JSON.stringify(menus));
            }
            return menus;
        }

        function loadAdminMenus() {
            const listContainer = document.getElementById("admin-menu-list");
            if (!listContainer) return;
            listContainer.innerHTML = "";
            const menus = getStoredMenus();

            menus.forEach((item, index) => {
                const div = document.createElement("div");
                div.className = "flex items-center justify-between bg-neutral-950 border border-neutral-800 p-3 rounded";
                div.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <img src="${item.image}" class="w-12 h-12 object-cover rounded border border-neutral-700" alt="${item.name}" onerror="this.src='https://via.placeholder.com/150?text=No+Image'">
                        <div>
                            <h4 class="text-sm font-bold text-white">${item.name}</h4>
                            <p class="text-xs font-mono text-red-500">${item.price} บาท | หมวด: ${item.category}</p>
                        </div>
                    </div>
                    <button onclick="deleteMenu(${index})" class="bg-neutral-800 hover:bg-red-600 text-white text-xs font-bold px-3 py-1.5 rounded transition">
                        🗑️ ลบ
                    </button>
                `;
                listContainer.appendChild(div);
            });
        }

        // เพิ่มเมนูใหม่พร้อมแปลงรูปเป็น Base64
        function handleAddNewMenu(event) {
            event.preventDefault();
            const name = document.getElementById("menu-name").value;
            const price = Number(document.getElementById("menu-price").value);
            const category = document.getElementById("menu-category").value;
            const fileInput = document.getElementById("menu-image");

            const file = fileInput.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const base64Image = e.target.result;
                    let menus = getStoredMenus();
                    
                    const newMenu = {
                        id: Date.now(),
                        name: name,
                        price: price,
                        category: category,
                        image: base64Image
                    };

                    menus.push(newMenu);
                    localStorage.setItem("kanantoy_menu_items", JSON.stringify(menus));
                    
                    alert("🎉 เพิ่มเมนูอาหารสำเร็จ!");
                    document.getElementById("add-menu-form").reset();
                    loadAdminMenus();
                };
                reader.readAsDataURL(file);
            } else {
                alert("กรุณาเลือกรูปภาพด้วยครับเพื่อน!");
            }
        }

        // ลบเมนู
        function deleteMenu(index) {
            if (confirm("ต้องการลบเมนูนี้ใช่หรือไม่ครับเพื่อน?")) {
                let menus = getStoredMenus();
                menus.splice(index, 1);
                localStorage.setItem("kanantoy_menu_items", JSON.stringify(menus));
                loadAdminMenus();
            }
        }
    </script>
</body>
</html>
